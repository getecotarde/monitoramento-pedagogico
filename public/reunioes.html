<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reuniões GETECO — Pautas e Encaminhamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#0D9488;--verde-bg:#E6FFFA;--verde-dark:#0F766E;
  --coral:#D85A30;--amber-bg:#FEF3DC;--amber-dark:#7A4A08;
  --azul:#2563EB;--azul-bg:#EFF6FF;--azul-dark:#1E3A8A;
  --bg:#F8F9FA;--card:#fff;--hover:#FAFAF8;--muted:#F3F2EF;--line:#E8E7E3;
  --tx:#1F2937;--tx2:#6B7280;--tx3:#9CA3AF;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --verde-bg:rgba(13,148,136,.16);--amber-bg:rgba(186,117,23,.2);--azul-bg:rgba(37,99,235,.16);
  --verde-dark:#5EEAD4;--amber-dark:#F2C879;--azul-dark:#93B4FB;
  --bg:#111110;--card:#1C1C1A;--hover:#252523;--muted:#2A2A28;--line:#2E2E2B;--tx:#F0EFE9;--tx2:#A8A7A0;--tx3:#6F6E69;--shadow:none;
}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{padding:16px 18px 40px;max-width:1500px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--tx2)}
.chip.ok{background:var(--verde-bg);color:var(--verde-dark);border-color:transparent}
.chip.warn{background:var(--amber-bg);color:var(--amber-dark);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card);cursor:pointer;font-size:12.5px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--tx)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}.btn.pri:hover{background:var(--verde-dark)}
.btn.danger{color:var(--coral)}.btn.sm{padding:3px 8px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--tx2)}
.tab:hover{background:var(--hover);color:var(--tx)}
.tab.active{background:var(--verde-bg);border-color:var(--verde);color:var(--verde-dark);font-weight:600}
.pane{display:none}.pane.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{font-size:12px;color:var(--tx2);margin-bottom:10px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:12px 14px}.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.kpi .l{font-size:12px;color:var(--tx2)}
.kpi.good .n{color:var(--verde-dark)}.kpi.bad .n{color:#C2410C}.kpi.blue .n{color:var(--azul)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);min-width:150px}
.filters .count{margin-left:auto;font-size:12px;color:var(--tx3)}
.notice{background:var(--amber-bg);color:var(--amber-dark);padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:12px}
.notice.info{background:var(--azul-bg);color:var(--azul-dark)}
.empty{padding:30px 16px;text-align:center;color:var(--tx2)}

/* layout reuniões */
.split{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.rlist{max-height:calc(100vh - 330px);overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.ritem{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;cursor:pointer;border-left:4px solid var(--cinza,#9CA3AF)}
.ritem:hover{background:var(--hover)}
.ritem.sel{outline:2px solid var(--verde);background:var(--verde-bg)}
.ritem .d{font-size:11.5px;font-weight:700;color:var(--tx2)}
.ritem .t{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:1px}
.ritem .m{font-size:11px;color:var(--tx3);margin-top:3px}
.t-Pedagógica{border-left-color:#0D9488}.t-PedagógicaConselho{border-left-color:#7C3AED}.t-EntregadeResultados{border-left-color:#2563EB}.t-Outros{border-left-color:#9CA3AF}
.tipo{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.tipo.Pedagógica{background:#0D9488}.tipo.PedagógicaConselho{background:#7C3AED}.tipo.EntregadeResultados{background:#2563EB}.tipo.Outros{background:#6B7280}
.dh h2{font-size:19px;letter-spacing:-.01em;margin:4px 0}
.dh .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.dh .meta b{color:var(--tx)}
.sec{margin-top:12px}.sec>b{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--verde-dark);margin-bottom:3px}
.pauta ul{list-style:none;padding:0}
.pauta li{padding:3px 0 3px 16px;position:relative}
.pauta li::before{content:"";position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--verde)}
.pauta li.n2{margin-left:18px;color:var(--tx2);font-size:13px}.pauta li.n2::before{background:var(--tx3);width:5px;height:5px}
.lnk{margin:3px 0 4px 2px;font-size:12px;color:var(--tx2)}.lnk .pill{font-size:9.5px;padding:1px 8px;margin-left:4px}
.sug{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border:0}.sug .tx{flex:1}.sug small{color:var(--tx3)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);flex:1;min-width:140px}
.enc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.enc .h{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.enc .tx{flex:1;min-width:220px;font-weight:600}
.enc .mt{font-size:12px;color:var(--tx2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.prog{height:6px;border-radius:99px;background:var(--muted);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%}
.late{color:#D92D20;font-weight:700}
.and{width:100%;margin-top:7px;min-height:34px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);resize:vertical;font-size:12.5px}
.and-ro{margin-top:6px;font-size:12.5px;color:var(--tx2);font-style:italic}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border:0;white-space:nowrap;text-align:center}
.pill.good{background:#DDF3E4;color:#17653F}.pill.warn{background:#FFF1B8;color:#7A5B00}.pill.blue{background:#DBEAFE;color:#1E40AF}.pill.na{background:var(--muted);color:var(--tx2)}.pill.bad{background:#FFD9B8;color:#9A3F05}
[data-theme="dark"] .pill.good{background:rgba(34,160,107,.22);color:#7BE0AE}
[data-theme="dark"] .pill.warn{background:rgba(229,168,0,.22);color:#F2D062}
[data-theme="dark"] .pill.blue{background:rgba(37,99,235,.25);color:#93B4FB}
[data-theme="dark"] .pill.bad{background:rgba(249,115,22,.22);color:#FDBA74}
select.pill{appearance:none;-webkit-appearance:none;cursor:pointer;padding:3px 12px}
.c-good{background:#22A06B}.c-warn{background:#E5A800}.c-blue{background:#3B82F6}.c-na{background:#C9C8C2}

.qa{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;padding:10px;border:1px dashed var(--verde);border-radius:10px;background:var(--verde-bg)}
.qa>*{min-width:0}.qa input,.qa select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);width:100%}
.qa .f1{flex:1 1 100%}.qa .fr{flex:1 1 170px}.qa .fp{flex:0 0 150px}
.qa .btn{padding:7px 9px}
.menu{position:relative;display:inline-block}
.menu-l{display:none;position:absolute;left:0;top:calc(100% + 4px);min-width:270px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:30}
.menu.open .menu-l{display:block}
.menu-l button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer;font-size:13px;color:var(--tx)}
.menu-l button:hover{background:var(--hover)}.menu-l hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* tabela */
.tw{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ts{overflow:auto;max-height:calc(100vh - 290px)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:#F3C99B;color:#4A2E0B;text-align:left;font-weight:700;padding:9px 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
[data-theme="dark"] thead th{background:#3A2E1E;color:#F2D3AB}
tbody td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:rgba(120,140,170,.07)}
td.nw{white-space:nowrap}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:50}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:780px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h2{font-size:16px}
.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--hover)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:3px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.fld textarea{min-height:60px;resize:vertical}
.help{font-size:11.5px;color:var(--tx3);margin-top:3px}

/* relatório */
.grp{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.rep-out .kv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.rep-out .kv div{border:1px solid #E5E5E5;border-radius:8px;padding:8px 12px;min-width:110px}.rep-out .kv b{display:block;font-size:20px}
.rep-out{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);overflow:auto}
.rep-out h1{font-size:19px;margin-bottom:2px}.rep-out .meta{font-size:12px;color:#666;margin-bottom:12px}
.rep-out h2{font-size:14px;margin:16px 0 5px;color:#0F766E;text-transform:uppercase;letter-spacing:.04em}
.rep-out h3{font-size:13px;margin:10px 0 3px}
.rep-out ul{padding-left:20px;margin-bottom:6px}.rep-out li{margin:2px 0}.rep-out .lnk{font-size:12px;color:#333;margin:2px 0 3px 2px}.rep-out li.n2{list-style:circle;margin-left:18px;color:#444}
.rep-out table{font-size:12px;margin:6px 0 10px}.rep-out th{position:static;background:#F3C99B;color:#4A2E0B;border:1px solid #ccc}
.rep-out td{border:1px solid #ddd;color:#111;background:#fff!important}

/* slides */
.slides{position:fixed;inset:0;background:#0B1F1D;color:#fff;z-index:80;display:none;flex-direction:column}
.slides.show{display:flex}
.sl-top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;font-size:12.5px;color:#9FD6CF}
.sl-top button,.sl-nav button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:7px;padding:6px 14px;cursor:pointer}
.sl-body{flex:1;overflow:auto;padding:10px 6vw 30px;display:flex;flex-direction:column;justify-content:center}
.sl-body h1{font-size:clamp(28px,4.4vw,54px);letter-spacing:-.02em;line-height:1.12;margin-bottom:10px}
.sl-body h2{font-size:clamp(22px,3vw,36px);margin-bottom:6px}
.sl-body .lead{font-size:clamp(14px,1.6vw,20px);color:#9FD6CF;margin-bottom:20px}
.sl-body ul{font-size:clamp(14px,1.7vw,22px);padding-left:22px;line-height:1.6}
.sl-body li.n2{font-size:.85em;color:#B6E4DE;margin-left:18px}
.sl-body .row{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:clamp(13px,1.5vw,19px);flex-wrap:wrap}
.sl-body .row .tx{flex:1;min-width:240px}.sl-body .row small{color:#9FD6CF}
.sl-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;gap:10px}
.sl-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.sl-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}.sl-dots i.on{background:#5EEAD4}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-l">
      <span class="chip" id="chipModo"><span class="dot"></span><span id="chipModoTxt">Carregando…</span></span>
      <span class="chip" id="chipPerfil">—</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="recarregar()">↻ Atualizar</button>
      <button class="btn pri" onclick="abrirSlides()">▶ Apresentar reunião</button>
    </div>
  </div>
  <div id="avisos"></div>

  <div class="tabs">
    <button class="tab active" data-p="reu" onclick="irAba('reu')">Reuniões e pautas</button>
    <button class="tab" data-p="enc" onclick="irAba('enc')">Encaminhamentos</button>
    <button class="tab" data-p="rel" onclick="irAba('rel')">Relatórios</button>
  </div>

  <section class="pane active" id="p-reu">
    <div id="kpis" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px"></div>
    <div class="split">
      <div>
        <button class="btn pri" id="btnNova" onclick="abrirReuniao(null)" style="width:100%;justify-content:center;margin-bottom:8px">+ Nova reunião</button>
        <div class="filters" style="margin-bottom:8px">
          <select id="fReu" onchange="escolherReu(this.value)" style="min-width:0;width:100%" title="Filtrar pela reunião (data · nome)"></select>
        </div>
        <div class="filters" style="margin-bottom:8px">
          <input id="fBusca" placeholder="Buscar…" title="Buscar por data, nome ou pessoa" oninput="renderLista()" style="min-width:0;flex:1">
          <select id="fTipo" onchange="renderLista()" style="min-width:0"></select>
        </div>
        <div class="rlist" id="rlist"></div>
      </div>
      <div id="detalhe"></div>
    </div>
  </section>

  <section class="pane" id="p-enc">
    <div class="filters">
      <input id="eBusca" placeholder="Buscar encaminhamento, reunião ou responsável…" oninput="renderEnc()" style="min-width:240px">
      <select id="eReu" onchange="renderEnc()" style="min-width:260px" title="Filtrar pela reunião (data · nome)"></select>
      <select id="eSt" onchange="renderEnc()"></select>
      <select id="eResp" onchange="renderEnc()"></select>
      <select id="eTipo" onchange="renderEnc()"></select>
      <button class="btn pri" onclick="abrirEnc(null,null)" id="btnNovoEnc">+ Novo encaminhamento</button>
      <button class="btn" onclick="imprimirEnc()" title="Imprime a lista exatamente como está filtrada na tela">🖨 Imprimir / PDF</button>
      <button class="btn danger" id="btnExcSel" onclick="excluirSelecionados()" style="display:none">🗑 Excluir selecionados (0)</button>
      <span class="count" id="eCount"></span>
    </div>
    <div class="tw"><div class="ts"><table id="eTab"></table></div></div>
  </section>


  <section class="pane" id="p-rel">
    <div class="card" style="margin-bottom:14px">
      <h3>Relatórios e documentos</h3>
      <div class="sub" id="rDesc"></div>
      <div class="filters" style="margin-bottom:6px">
        <select id="rTipo" onchange="renderRel()" style="min-width:260px">
          <optgroup label="Principais">
            <option value="pauta">Pauta da reunião</option>
            <option value="ata">Registro / ata da reunião</option>
            <option value="quadro">Quadro de avisos</option>
            <option value="abertos">Encaminhamentos em aberto</option>
            <option value="resp">Painel por responsável</option>
          </optgroup>
          <optgroup label="Mais relatórios">
            <option value="atrasos">Atrasados e sem prazo</option>
            <option value="assunto">Ações por assunto</option>
            <option value="recorr">Assuntos mais recorrentes</option>
            <option value="tipo">Síntese por tipo de reunião</option>
            <option value="periodo">Resumo do período / histórico</option>
            <option value="definir">Itens a definir na pauta</option>
            <option value="sugestoes">Pautas sugeridas e aceitação</option>
          </optgroup>
        </select>
        <select id="rReu" data-g="reu" onchange="renderRel()" style="min-width:260px"></select>
        <span class="grp" data-g="ass"><select id="rAss" onchange="$('rAssTxt').value='';renderRel()" style="min-width:200px"></select><input id="rAssTxt" placeholder="ou digite um assunto…" oninput="$('rAss').value='';renderRel()" style="min-width:170px"></span>
        <select id="rFTipo" data-g="tipo" onchange="renderRel()"></select>
        <select id="rResp" data-g="resp" onchange="renderRel()"></select>
        <span class="grp" data-g="qop"><select id="qSt" onchange="renderRel()" style="min-width:0" title="Quais encaminhamentos entram no quadro"><option value="abertos">Somente em aberto</option><option value="todos">Todos os encaminhamentos</option></select><select id="qOr" onchange="renderRel()" style="min-width:0" title="Orientação da folha"><option value="port">Folha em pé (retrato)</option><option value="land">Folha deitada (paisagem)</option></select><label style="font-size:12.5px;color:var(--tx2)"><input type="checkbox" id="qAnd" onchange="renderRel()" style="min-width:0"> mostrar andamento</label></span>
        <span class="grp" data-g="per"><span style="font-size:12px;color:var(--tx2)">de</span><input type="date" id="rDe" onchange="renderRel()" style="min-width:0"><span style="font-size:12px;color:var(--tx2)">até</span><input type="date" id="rAte" onchange="renderRel()" style="min-width:0"></span>
      </div>
      <div class="filters" style="margin-bottom:0">
        <label data-g="sug" style="font-size:12.5px;color:var(--tx2)"><input type="checkbox" id="rSug" checked onchange="renderRel()" style="min-width:0"> incluir pautas sugeridas</label>
        <label data-g="ret" style="font-size:12.5px;color:var(--tx2)"><input type="checkbox" id="rRet" checked onchange="renderRel()" style="min-width:0"> incluir retomada de encaminhamentos em aberto</label>
        <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn pri" id="btnJpg" onclick="quadroJPG()" style="display:none">🖼 Baixar JPG</button>
          <button class="btn pri" onclick="repImprimir()">🖨 Imprimir / PDF</button>
          <button class="btn" onclick="repWord()">⬇ Word (.doc)</button>
          <button class="btn" onclick="repCSV()">⬇ CSV</button>
          <button class="btn" onclick="repCopiar()">⧉ Copiar texto</button>
        </span>
      </div>
    </div>
    <div class="rep-out" id="repOut"></div>
  </section>
</div>

<div class="ov" id="ovReu" onclick="if(event.target===this)fecharOv('ovReu')"><div class="modal">

function fmtData(iso,sem){if(!iso)return '—';const [y,m,d]=iso.split('-');const s=`${d}/${m}/${y}`;return sem?`${s} (${DS[new Date(+y,+m-1,+d).getDay()]})`:s;}

/* ── persistência ── */
/* status antigos (Não iniciado / A confirmar / Cancelado) passam a Pendente / Concluído, sem perder a informação */
function normSt(r){r.encaminhamentos=(r.encaminhamentos||[]).map(e=>{
  if(e.status==='Cancelado'){e.status='Concluído';if(!/^cancelad/i.test(e.andamento||''))e.andamento=('Cancelado. '+(e.andamento||'')).trim();}
  else if(!['Pendente','Em andamento','Concluído'].includes(e.status))e.status='Pendente';
  return e;});return r;}
async function carregar(){
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?select=*&order=data.desc,id.desc`,{headers:sbH()});
    const d=await r.json();
    if(r.ok&&Array.isArray(d)){modo='supabase';rows=d.map(x=>normSt({...x,sugestoes:x.sugestoes||[],encaminhamentos:x.encaminhamentos||[]}));return;}
  }catch(e){}
  modo='local';
  try{rows=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){rows=null;}
  rows=Array.isArray(rows)?rows.map(r=>normSt({...r,sugestoes:r.sugestoes||[]})):[];
}
const gravarLocal=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(rows));}catch(e){}};
/* grava só os campos alterados (reduz conflito entre quem edita ao mesmo tempo) */
async function persistir(r,campos){
  if(modo==='local'){if(!r.id)r.id=Math.max(0,...rows.map(x=>x.id||0))+1;if(!rows.includes(r))rows.push(r);gravarLocal();return true;}
  try{
    const todos=['data','titulo','tipo','horario','local','participantes','responsavel','obs','pauta','sugestoes','encaminhamentos'];
    const body={};(r.id&&campos?campos:todos).forEach(k=>body[k]=r[k]);
    const resp=r.id?await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?id=eq.${r.id}`,{method:'PATCH',headers:sbH(),body:JSON.stringify(body)})
                   :await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}`,{method:'POST',headers:sbH(),body:JSON.stringify(body)});
    if(!resp.ok)throw new Error(await resp.text());
    const d=await resp.json();if(!r.id&&d[0]){r.id=d[0].id;rows.push(r);}
    return true;
  }catch(e){console.error(e);toast('Erro ao salvar no Supabase — veja o console.');return false;}
}
async function remover(r){
  if(modo==='local'){rows=rows.filter(x=>x!==r);gravarLocal();return true;}
  try{const resp=await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?id=eq.${r.id}`,{method:'DELETE',headers:sbH()});if(!resp.ok)throw 0;rows=rows.filter(x=>x!==r);return true;}
  catch(e){toast('Erro ao excluir.');return false;}
}
async function recarregar(){await carregar();renderTudo();toast('Dados atualizados.');}

/* ── pauta: texto ⇄ estrutura (# seção · - item · -- subitem) ── */
function parsePauta(t){
  const secs=[];let cur=null;
  String(t||'').split('\n').forEach(l=>{
    const s=l.replace(/\s+$/,'');if(!s.trim())return;
    if(/^#\s*/.test(s)){cur={t:s.replace(/^#\s*/,''),i:[]};secs.push(cur);}
    else{if(!cur){cur={t:'',i:[]};secs.push(cur);}
      if(/^--\s*/.test(s))cur.i.push({n:2,x:s.replace(/^--\s*/,'')});
      else cur.i.push({n:1,x:s.replace(/^-\s*/,'')});}
  });
  return secs;
}
const pautaHTML=secs=>secs.map(s=>`<div class="sec">${s.t?`<b>${esc(s.t)}</b>`:''}<ul>${s.i.map(i=>`<li class="${i.n===2?'n2':''}">${esc(i.x)}</li>`).join('')}</ul></div>`).join('');

function serializePauta(secs){return secs.map(s=>(s.t?'# '+s.t+'\n':'')+s.i.map(i=>(i.n===2?'-- ':'- ')+i.x).join('\n')).join('\n');}
/* vínculo encaminhamento → item da pauta (secao + item) */
function itensDe(r){const out=[];parsePauta(r.pauta).forEach((s,si)=>s.i.forEach((i,ii)=>out.push({k:si+'|'+ii,sec:s.t,x:i.x,n:i.n})));return out;}
const itemOK=(r,e)=>!!e.item&&itensDe(r).some(i=>i.sec===(e.secao||'')&&i.x===e.item);
const itemTxt=e=>e.item?((e.secao?e.secao+' › ':'')+e.item):'';
const semVinculo=r=>r.encaminhamentos.filter(e=>!itemOK(r,e));
/* pauta com os encaminhamentos de cada item logo abaixo */
function pautaComEnc(r,doc){
  return parsePauta(r.pauta).map(s=>`<div class="sec">${s.t?(doc?`<h3>${esc(s.t)}</h3>`:`<b>${esc(s.t)}</b>`):''}<ul>${s.i.map(i=>{
    const ls=r.encaminhamentos.filter(e=>(e.secao||'')===s.t&&e.item===i.x);
    return `<li class="${i.n===2?'n2':''}">${esc(i.x)}${ls.map(e=>doc?`<div class="lnk">↳ <b>Encaminhamento:</b> ${esc(e.texto)} — ${esc(e.responsavel||'—')}${e.prazo?' (prazo '+fmtData(e.prazo)+')':''} [${esc(e.status)}]</div>`:`<div class="lnk">↳ ${esc(e.texto)} <small>— ${esc(e.responsavel||'—')}</small><span class="pill ${stCls(e.status)}">${esc(e.status)}</span></div>`).join('')}</li>`;}).join('')}</ul></div>`).join('');
}
/* ── nomes (referência) ── */
function nomesConhecidos(){
  const set=new Set();
  const add=v=>String(v||'').split(/,| e |;|\//).map(x=>x.trim()).filter(x=>x&&x.length<40&&!/\(/.test(x)).forEach(x=>set.add(x));
  rows.forEach(r=>{add(r.responsavel);r.encaminhamentos.forEach(e=>add(e.responsavel));r.sugestoes.forEach(s=>add(s.autor));});
  return [...set].sort((a,b)=>a.localeCompare(b,'pt'));
}
/* encaminhamentos na ordem em que o item aparece na pauta original (sem vínculo, por último) */
function encOrd(r){const ord=new Map();itensDe(r).forEach((it,i)=>ord.set(it.sec+'\u0001'+it.x,i));
  return r.encaminhamentos.map((e,i)=>({e,i,k:ord.has((e.secao||'')+'\u0001'+e.item)?ord.get((e.secao||'')+'\u0001'+e.item):1e9})).sort((a,b)=>a.k-b.k||a.i-b.i).map(x=>x.e);}
const todosEnc=()=>rows.flatMap(r=>r.encaminhamentos.map(e=>({e,r})));

const stCls=s=>({'Concluído':'good','Em andamento':'blue','Pendente':'warn','Aceita':'good','Sugerida':'warn','Descartada':'na'}[s]||'na');

   <div class="card"><h3>⚠ Encaminhamentos atrasados <span class="chip ${atr.length?'warn':'ok'}">${atr.length}</span></h3>${atr.length?atr.slice(0,4).map(({e,r})=>`<div class="sug" style="cursor:pointer" onclick="irReu(${r.id})"><div class="tx">${esc(cur(e.texto))}<br><small>👤 ${esc(e.responsavel||'—')} · prazo ${fmtData(e.prazo)} · ${fmtData(r.data)}</small></div></div>`).join('')+(atr.length>4?`<div class="sub" style="margin:6px 0 0">+ ${atr.length-4} outros — </div>`:'')+`<button class="btn sm" style="margin-top:6px" onclick="gerarDe(sel,'atrasos')">Ver todos / imprimir</button>`:'<div class="sub">Nenhum encaminhamento com prazo vencido. 👏</div>'}</div>`;
}
function filtrar(lista,busca,tipo){
  const q=norm(busca);
  return lista.filter(r=>(!tipo||r.tipo===tipo)&&(!q||norm([fmtData(r.data),r.data,r.titulo,r.tipo,r.responsavel,r.participantes,r.pauta,...r.encaminhamentos.map(e=>e.responsavel)].join(' ')).includes(q)));

    <button class="btn sm" title="Editar encaminhamento" onclick="abrirEnc(${r.id},'${e.id}')">✎ Editar</button><button class="btn sm danger" title="Excluir — não é um encaminhamento (ex.: apenas repasse)" onclick="excluirEncDireto(${r.id},'${e.id}')">🗑 Excluir</button>`:`<span class="pill ${stCls(e.status)}">${esc(e.status)}</span>`}</div>
   <div class="mt" style="margin-top:3px"><span>📌 ${itemOK(r,e)?'Item da pauta: <b>'+esc(itemTxt(e))+'</b>':'<span class="late">⚠ sem item da pauta — edite e vincule</span>'}</span></div>
   <div class="mt"><span>👤 ${esc(e.responsavel||'—')}</span><span>📅 prazo: ${e.prazo?fmtData(e.prazo):'—'}${at?' <span class="late">· atrasado</span>':''}</span></div>
   <div class="prog"><i class="${e.status==='Concluído'?'c-good':e.status==='Em andamento'?'c-blue':'c-na'}" style="width:${p}%"></i></div>
   ${editavel?`<textarea class="and" placeholder="Andamento: o que já foi feito, pendências, observações…" onchange="setEncAnd(${r.id},'${e.id}',this.value)">${esc(e.andamento)}</textarea>`:(e.andamento?`<div class="and-ro">${esc(e.andamento)}</div>`:'')}</div>`;
}

  if(!r){$('detalhe').innerHTML='<div class="card empty">Selecione ou cadastre uma reunião.</div>';return;}
  const ed=podeEditar(),secs=parsePauta(r.pauta);
  $('detalhe').innerHTML=`
  <div class="card dh" style="margin-bottom:14px">
    <span class="tipo ${tk(r.tipo)}">${esc(r.tipo)}</span>
    <h2>${esc(r.titulo)}</h2>
    <div class="meta"><span>📅 <b>${fmtData(r.data,1)}</b></span>${r.horario?`<span>🕒 <b>${esc(r.horario)}</b></span>`:''}${r.local?`<span>📍 ${esc(r.local)}</span>`:''}<span>👤 ${esc(r.responsavel||'—')}</span></div>
    ${r.participantes?`<div class="meta" style="margin-top:3px"><span>👥 ${esc(r.participantes)}</span></div>`:''}

  const used=new Set(),gs=[];
  itensDe(r).forEach(it=>{const ls=list.filter(e=>(e.secao||'')===it.sec&&e.item===it.x);ls.forEach(e=>used.add(e));if(ls.length)gs.push({sec:it.sec,item:it.x,ls});});

}

/* gera a imagem JPG do quadro direto em canvas (não depende de bibliotecas externas) */

  const cv=document.createElement('canvas');cv.width=W;cv.height=100;const c=cv.getContext('2d');
  const font=(px,w,it)=>`${it?'italic ':''}${w||'normal'} ${px}px ${F}`;
  const wrap=(t,px,w,maxW,it)=>{c.font=font(px,w,it);const out=[];String(t).split('\n').forEach(par=>{let ln='';par.split(/\s+/).forEach(wd=>{const tt=ln?ln+' '+wd:wd;if(c.measureText(tt).width>maxW&&ln){out.push(ln);ln=wd;}else ln=tt;});out.push(ln);});return out;};

  const pt=(x,y,e,n,first,draw)=>{
    const pad=26,ind=n?52:0,inner=BW-2*pad-ind,tx=x+pad+ind;

    c.font=font(24,'normal');const same=rl.length===1&&c.measureText(rl[0]).width+c.measureText(pz).width+50<=inner;
    const need=20+tl.length*40+10+(same?32:rl.length*32+32)+16+38+(and.length?10+and.length*30:0)+22;

    c.fillStyle='#111';c.font=font(30,'bold');tl.forEach((l,i)=>c.fillText(l,tx,cy+i*40));cy+=tl.length*40+10;
    c.fillStyle='#1F2937';c.font=font(24,'normal');rl.forEach((l,i)=>c.fillText(l,tx,cy+i*32));
    if(same){c.textAlign='right';c.fillStyle=atrasado(e)?'#D92D20':'#1F2937';c.font=font(24,atrasado(e)?'bold':'normal');c.fillText(pz,x+BW-pad,cy);c.textAlign='left';cy+=32+16;}
    else{cy+=rl.length*32;c.fillStyle=atrasado(e)?'#D92D20':'#1F2937';c.font=font(24,atrasado(e)?'bold':'normal');c.fillText(pz,tx,cy);cy+=32+16;}
    const pc=PILL[stCls(e.status)]||['#fff','#111'];c.font=font(22,'bold');const pw=c.measureText(e.status).width+32;
    c.fillStyle=pc[0];rr(tx,cy,pw,38,19);c.fill();if(pc[0]==='#fff'){c.strokeStyle='rgba(0,0,0,.3)';c.lineWidth=2;c.stroke();}
    c.fillStyle=pc[1];c.fillText(e.status,tx+16,cy+8);cy+=38;
    if(and.length){cy+=10;c.fillStyle='#444';c.font=font(22,'normal',true);and.forEach((l,i)=>c.fillText(l,tx,cy+i*30));}

  };
  const run=draw=>{
    c.textBaseline='top';let y=M;
    const tl=wrap(r.titulo,46,'bold',BW-60),ml=wrap(quadroMeta(r),26,'normal',BW-60),hh=30+28+tl.length*56+6+ml.length*34+30;
    if(draw){c.fillStyle='#0F766E';rr(M,y,BW,hh,18);c.fill();c.fillStyle='rgba(255,255,255,.85)';c.font=font(22,'bold');c.fillText('QUADRO DE AVISOS · ENCAMINHAMENTOS',M+30,y+30);
      c.fillStyle='#fff';c.font=font(46,'bold');tl.forEach((l,i)=>c.fillText(l,M+30,y+58+i*56));c.font=font(26,'normal');ml.forEach((l,i)=>c.fillText(l,M+30,y+58+tl.length*56+6+i*34));}

        c.fillStyle='#111';c.font=font(32,'bold');il.forEach((l,i)=>c.fillText(l,M+28,ty+i*42));

        <h2>Encaminhamentos</h2>${encOrd(r).length?tabH(['Item da pauta','Encaminhamento','Responsável','Prazo','Status','Andamento'],encOrd(r).map(e=>[itemTxt(e)||'—',e.texto,e.responsavel||'—',e.prazo?fmtData(e.prazo):'—',e.status,e.andamento||''])):'<p><i>Nenhum.</i></p>'}
        <h2>Lista de presença</h2><div class="assin">${tabH(['Nome','Assinatura'],Array.from({length:12},()=>['','']))}</div>`;
      tab=[['Item da pauta','Encaminhamento','Responsável','Prazo','Status','Andamento'],...encOrd(r).map(e=>[itemTxt(e),e.texto,e.responsavel,e.prazo?fmtData(e.prazo):'',e.status,e.andamento])];
      texto=`*${titulo}*\n${meta}\n\n*Encaminhamentos*\n`+(encOrd(r).map(e=>`• ${e.texto} — ${e.responsavel||'—'}${e.prazo?' (prazo '+fmtData(e.prazo)+')':''} [${e.status}]${e.item?' · item: '+e.item:''}${e.andamento?' · '+e.andamento:''}`).join('\n')||'—');
    }
  }
  if(tipo==='quadro'){
    const r=rows.find(x=>x.id===+er.value)||lista[0],orient=$('qOr').value==='land'?'land':'port',soAb=$('qSt').value==='abertos';
    const list=encOrd(r).filter(e=>soAb?aberto(e):true);
    titulo=`Quadro de avisos — ${r.titulo}`;meta=`${escola}\n${fmtData(r.data,1)} · ${r.tipo}`;
    tab=[['Item da pauta','Encaminhamento','Responsável','Prazo','Status','Andamento'],...list.map(e=>[e.item||'',e.texto,e.responsavel||'',e.prazo?fmtData(e.prazo):'',e.status,e.andamento||''])];
    texto=`*${titulo}*\n${meta}\n\n`+(list.map(txtEnc2=>`• ${txtEnc2.texto} — ${txtEnc2.responsavel||'—'}${txtEnc2.prazo?' (prazo '+fmtData(txtEnc2.prazo)+')':''} [${txtEnc2.status}]`).join('\n')||'—');
    if(list.length){quadro=orient;html=quadroHTML(r,list,orient,$('qAnd').checked);}
    else{vazio=true;html=`<div class="empty" style="color:#666">${r.encaminhamentos.length?'Nenhum encaminhamento em aberto nesta reunião. Escolha “Todos os encaminhamentos” para incluir os concluídos.':'Esta reunião ainda não tem encaminhamentos registrados.'}</div>`;}
  }
  if(tipo==='abertos'||tipo==='atrasos'){
    const l=encs.filter(({e})=>tipo==='abertos'?aberto(e):(atrasado(e)||(['Pendente','Em andamento'].includes(e.status)&&!e.prazo))).sort((a,b)=>(a.e.prazo||'9999').localeCompare(b.e.prazo||'9999'));
    titulo=tipo==='abertos'?'Encaminhamentos em aberto':'Encaminhamentos atrasados e sem prazo';
    const cols=tipo==='atrasos'?[...COLS_ENC,'Situação']:COLS_ENC;
    const linhas=l.map(x=>tipo==='atrasos'?[...linhaEnc(x),atrasado(x.e)?'Atrasado':'Sem prazo']:linhaEnc(x));
    tab=[cols,...linhas];html=`<p>${l.length} encaminhamento(s).</p>`+tabH(cols,linhas);
    texto=`*${titulo}*\n${l.map(txtEnc).join('\n')||'• nenhum'}`;
  }
  if(tipo==='resp'){
    titulo='Painel de encaminhamentos por responsável';const mp={};
    encs.forEach(({e})=>nomesDe(e.responsavel).forEach(nm=>{const o=mp[nm]=mp[nm]||{t:0,c:0,a:0,n:0,x:0,at:0};o.t++;if(e.status==='Concluído')o.c++;else if(e.status==='Em andamento')o.a++;else o.n++;if(atrasado(e))o.at++;}));
    const ord=Object.entries(mp).sort((a,b)=>(b[1].t-b[1].c)-(a[1].t-a[1].c)||a[0].localeCompare(b[0],'pt'));
    const cols=['Responsável','Total','Concluídos','Em andamento','Pendentes','Atrasados','% concluído'];
    tab=[cols,...ord.map(([k,o])=>[k,o.t,o.c,o.a,o.n,o.at,pc(o.c,o.t)])];
    html='<p>Encaminhamentos divididos por pessoa/grupo (um encaminhamento com dois responsáveis conta para os dois).</p>'+tabH(cols,tab.slice(1));
    texto=`*${titulo}*\n`+ord.map(([k,o])=>`• ${k}: ${o.c}/${o.t} concluídos${o.at?`, ${o.at} atrasado(s)`:''}`).join('\n');
  }
  if(tipo==='assunto'){
    const as=assuntoSel();
    if(!as){titulo='Ações por assunto';html='<p><i>Escolha um assunto na lista ou digite um termo para pesquisar.</i></p>';}
    else{
      titulo='Ações por assunto — '+as.n;const blocos=[];let nR=0,nE=0,nC=0;
      tab=[['Reunião','Tipo','Origem','Seção / item','Responsável','Prazo','Status']];
      base.forEach(r=>{const m=reuCasa(r,as);const el=m.encs.filter(e=>!fr||norm(e.responsavel).includes(fr));if(!m.itens.length&&!el.length&&!m.sugs.length)return;
        if(fr&&!el.length)return;nR++;nE+=el.length;nC+=el.filter(e=>e.status==='Concluído').length;
        const porSec={};m.itens.forEach(i=>(porSec[i.sec]=porSec[i.sec]||[]).push(i));
        blocos.push(`<h2>${esc(ref(r))} <small style="color:#666;text-transform:none">· ${esc(r.tipo)}</small></h2>`
          +(m.itens.length?`<h3>O que foi tratado</h3>`+Object.entries(porSec).map(([s,l])=>`${s?`<p style="margin:4px 0 0"><b>${esc(s)}</b></p>`:''}<ul>${l.map(i=>`<li class="${i.n===2?'n2':''}">${esc(i.x)}</li>`).join('')}</ul>`).join(''):'')
          +(m.sugs.length?`<h3>Pautas sugeridas</h3><ul>${m.sugs.map(s=>`<li>${esc(s.texto)} — ${esc(s.status)}</li>`).join('')}</ul>`:'')
          +(el.length?`<h3>Encaminhamentos</h3>`+tabH(['Item da pauta','Encaminhamento','Responsável','Prazo','Status','Andamento'],el.map(e=>[itemTxt(e)||'—',e.texto,e.responsavel||'—',e.prazo?fmtData(e.prazo):'—',e.status+(atrasado(e)?' (atrasado)':''),e.andamento||''])):''));
        Object.entries(porSec).forEach(([s,l])=>l.forEach(i=>tab.push([ref(r),r.tipo,'Pauta',(s?s+' › ':'')+i.x,'','','']))); 
        el.forEach(e=>tab.push([ref(r),r.tipo,'Encaminhamento',(e.item?'['+e.item+'] ':'')+e.texto,e.responsavel||'',e.prazo?fmtData(e.prazo):'',e.status]));
        m.sugs.forEach(s=>tab.push([ref(r),r.tipo,'Sugestão',s.texto,s.autor||'','',s.status]));});
      html=`<p><b>${nR}</b> reunião(ões) trataram do assunto · <b>${nE}</b> encaminhamento(s), <b>${nC}</b> concluído(s) (${pc(nC,nE)}).</p>`+(blocos.join('')||'<p><i>Nada encontrado para este assunto e filtros.</i></p>');
      texto=`*${titulo}*\n${nR} reunião(ões) · ${nE} encaminhamento(s), ${nC} concluído(s)\n`+tab.slice(1).filter(l=>l[2]==='Encaminhamento').map(l=>`• ${l[3]} — ${l[4]||'—'} [${l[6]}] (${l[0].split(' · ')[0]})`).join('\n');}
  }
  if(tipo==='recorr'){
    titulo='Assuntos mais recorrentes nas reuniões';
    const lin=TEMAS.map(t=>{const rs=[];let ne=0,nc=0;base.forEach(r=>{const m=reuCasa(r,t);if(m.tem){rs.push(r);ne+=m.encs.length;nc+=m.encs.filter(e=>e.status==='Concluído').length;}});return{t,rs,ne,nc};}).sort((a,b)=>b.rs.length-a.rs.length);
    const cols=['Assunto','Reuniões','Em que datas','Encaminhamentos','Concluídos'];
    tab=[cols,...lin.map(x=>[x.t.n,x.rs.length+' de '+base.length,x.rs.map(r=>fmtData(r.data).slice(0,5)).join(', ')||'—',x.ne,pc(x.nc,x.ne)])];
    html=`<p>Em quantas das ${base.length} reuniões cada assunto apareceu (na pauta ou nos encaminhamentos). Assuntos que voltam sempre costumam merecer fluxo fixo, prazo único ou um item permanente de pauta.</p>`+tabH(cols,tab.slice(1));
    texto=`*${titulo}*\n`+lin.map(x=>`• ${x.t.n}: ${x.rs.length}/${base.length} reuniões`).join('\n');
  }
  if(tipo==='tipo'){
    titulo='Síntese por tipo de reunião';
    const cols=['Tipo','Reuniões','Itens de pauta','Sugestões','Encaminhamentos','Concluídos','Em aberto'];
    const ln=TIPOS.map(tp=>{const rs=base.filter(r=>r.tipo===tp),es=rs.flatMap(r=>r.encaminhamentos);return[tp,rs.length,rs.reduce((n,r)=>n+parsePauta(r.pauta).reduce((m,s)=>m+s.i.length,0),0),rs.reduce((n,r)=>n+r.sugestoes.length,0),es.length,pc(es.filter(e=>e.status==='Concluído').length,es.length),es.filter(aberto).length];});
    tab=[cols,...ln];
    html='<p>Compara como cada tipo de reunião se comporta: quanto se pauta, quanto se encaminha e quanto se cumpre.</p>'+tabH(cols,ln)+'<h2>Reuniões do período por tipo</h2>'+TIPOS.map(tp=>{const rs=base.filter(r=>r.tipo===tp);return rs.length?`<h3>${esc(tp)} (${rs.length})</h3><ul>${rs.map(r=>`<li>${esc(ref(r))}</li>`).join('')}</ul>`:'';}).join('');
    texto=`*${titulo}*\n`+ln.map(l=>`• ${l[0]}: ${l[1]} reunião(ões), ${l[4]} encaminhamento(s), ${l[5]} concluídos`).join('\n');
  }
  if(tipo==='periodo'){
    titulo='Resumo do período';const tot=encs.length,conc=encs.filter(x=>x.e.status==='Concluído').length;
    const cols=['Data','Tipo','Reunião','Itens de pauta','Sugestões','Encaminhamentos (concl./total)'];
    const ln=base.map(r=>[fmtData(r.data),r.tipo,r.titulo,parsePauta(r.pauta).reduce((n,s)=>n+s.i.length,0),r.sugestoes.length,r.encaminhamentos.filter(e=>e.status==='Concluído').length+'/'+r.encaminhamentos.length]);
    const rec=TEMAS.map(t=>({t,n:base.filter(r=>reuCasa(r,t).tem).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,5);
    const abertosL=encs.filter(x=>aberto(x.e)).sort((a,b)=>(a.e.prazo||'9999').localeCompare(b.e.prazo||'9999'));
    tab=[cols,...ln];
    html=`<div class="kv"><div><b>${base.length}</b>reuniões</div><div><b>${tot}</b>encaminhamentos</div><div><b>${pc(conc,tot)}</b>concluídos</div><div><b>${abertosL.length}</b>em aberto</div><div><b>${encs.filter(x=>atrasado(x.e)).length}</b>atrasados</div></div>
      <h2>Reuniões</h2>${tabH(cols,ln)}<h2>Assuntos mais tratados</h2>${rec.length?`<ul>${rec.map(x=>`<li>${esc(x.t.n)} — ${x.n} reunião(ões)</li>`).join('')}</ul>`:'<p><i>—</i></p>'}
      <h2>Encaminhamentos em aberto</h2>${abertosL.length?tabH(COLS_ENC,abertosL.map(linhaEnc)):'<p><i>Nenhum.</i></p>'}`;
    texto=`*${titulo}*\n${meta}\n${base.length} reunião(ões) · ${tot} encaminhamento(s), ${pc(conc,tot)} concluídos, ${abertosL.length} em aberto\n\n`+ln.map(l=>`• ${l[0]} — ${l[2]}`).join('\n');
  }
  if(tipo==='definir'){
    titulo='Itens da pauta a definir ou não discutidos';const rx=/a definir|nao discutid|\?\?\?|\?!|nao definid|a confirmar/;const ln=[];
    base.forEach(r=>parsePauta(r.pauta).forEach(s=>s.i.forEach(i=>{if(rx.test(norm(i.x))||rx.test(norm(s.t)))ln.push([ref(r),s.t,i.x]);})));
    const cols=['Reunião','Seção','Item'];tab=[cols,...ln];
    html=`<p>${ln.length} item(ns) deixados em aberto nas pautas. Podem voltar como pauta da próxima reunião.</p>`+tabH(cols,ln);
    texto=`*${titulo}*\n`+ln.map(l=>`• ${l[2]} (${l[0].split(' · ')[0]})`).join('\n');
  }
  if(tipo==='sugestoes'){
    titulo='Pautas sugeridas e aceitação';const ln=base.flatMap(r=>r.sugestoes.map(s=>[ref(r),s.texto,s.autor||'—',s.data?fmtData(s.data):'—',s.status]));
    const c=st=>ln.filter(l=>l[4]===st).length,cols=['Reunião','Sugestão','Autor','Data','Status'];tab=[cols,...ln];
    html=`<div class="kv"><div><b>${ln.length}</b>sugestões</div><div><b>${c('Aceita')}</b>aceitas</div><div><b>${c('Sugerida')}</b>aguardando</div><div><b>${c('Descartada')}</b>descartadas</div></div>`+tabH(cols,ln);
    texto=`*${titulo}*\n`+ln.map(l=>`• ${l[1]} (${l[2]}) — ${l[4]}`).join('\n');
  }
  $('repOut').innerHTML=quadro?`<style>${quadroCSS}</style>${html}`:vazio?html:`<h1>${esc(titulo)}</h1><div class="meta">${esc(meta).replace(/\n/g,'<br>')}</div>${html}`;
  rep={titulo,html,rows:tab,texto,meta,quadro,vazio};
}
const tabH=(cab,l)=>`<table><thead><tr>${cab.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${l.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const docCSS=`@page{size:A4 portrait;margin:14mm}body{font-family:Arial,sans-serif;color:#111;font-size:12px;line-height:1.45}h1{font-size:18px;margin:0 0 2px}.meta{color:#555;margin-bottom:12px}h2{font-size:13px;margin:14px 0 4px;color:#0F766E;text-transform:uppercase;border-bottom:1px solid #ccc;padding-bottom:2px}h3{font-size:12.5px;margin:9px 0 2px}ul{padding-left:20px;margin:2px 0 6px}li.n2{list-style:circle;margin-left:16px;color:#444}.lnk{font-size:11px;color:#333;margin:2px 0 3px 2px;list-style:none}table{width:100%;border-collapse:collapse;margin:6px 0 10px}.kv{display:flex;gap:10px;margin-bottom:10px}.kv div{border:1px solid #ccc;border-radius:6px;padding:6px 10px}.kv b{display:block;font-size:18px}th{background:#F3C99B;color:#4A2E0B;border:1px solid #bbb;padding:4px 5px;text-align:left;font-size:11px}td{border:1px solid #ccc;padding:4px 5px;vertical-align:top}tr{page-break-inside:avoid}.assin td{height:26px}`;
const docHTML=()=>rep.quadro?`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${esc(rep.titulo)}</title><style>@page{size:A4 ${rep.quadro==='land'?'landscape':'portrait'};margin:10mm}body{margin:0}${quadroCSS}</style></head><body>${rep.html}</body></html>`:`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${esc(rep.titulo)}</title><style>${docCSS}</style></head><body><h1>${esc(rep.titulo)}</h1><div class="meta">${esc(rep.meta).replace(/\n/g,'<br>')}</div>${rep.html}</body></html>`;
/* único caminho de impressão: todos os documentos passam por aqui */
function abrirImpressao(titulo,corpo,o={}){
  const doc=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${esc(titulo)}</title><style>${docCSS}@page{size:A4 ${o.land?'landscape':'portrait'};margin:${o.margem||'14mm'}}${o.css||''}thead{display:table-header-group}</style></head><body>${corpo}</body></html>`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write(doc);d.close();
  setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),2000);},350);
}
function repImprimir(){
  if(!rep.html||rep.vazio){toast('Nada para imprimir.');return;}
  if(rep.quadro)abrirImpressao(rep.titulo,rep.html,{land:rep.quadro==='land',margem:'10mm',css:quadroCSS+'body{margin:0}'});
  else abrirImpressao(rep.titulo,`<h1>${esc(rep.titulo)}</h1><div class="meta">${esc(rep.meta).replace(/\n/g,'<br>')}</div>${rep.html}`);
}
function baixar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
const nomeArq=()=>(rep.titulo||'reuniao').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'_').slice(0,60);
function repWord(){if(!rep.html){toast('Nada para exportar.');return;}baixar(new Blob(['\ufeff'+docHTML()],{type:'application/msword'}),nomeArq()+'.doc');}
function repCSV(){if(!rep.rows.length){toast('Nada para exportar.');return;}baixar(new Blob(['\ufeff'+rep.rows.map(l=>l.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),nomeArq()+'.csv');}
async function repCopiar(){const t=rep.texto||rep.rows.map(l=>l.join('\t')).join('\n');if(!t){toast('Nada para copiar.');return;}try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}toast('Texto copiado.');}

/* ═══ APRESENTAÇÃO (slides) ═══ */
let slIdx=0,slList=[];
function montarSlides(){
  const r=rows.find(x=>x.id===sel);if(!r)return false;
  const secs=parsePauta(r.pauta);slList=[];
  slList.push(`<span class="lead" style="margin:0">${esc(r.tipo)}</span><h1>${esc(r.titulo)}</h1><div class="lead">${fmtData(r.data,1)}${r.horario?' · '+esc(r.horario):''}${r.local?' · '+esc(r.local):''}</div><div class="lead" style="font-size:15px">${esc(r.participantes||'')}</div>`);
  secs.forEach(s=>slList.push(`<h2>${esc(s.t||'Pauta')}</h2><div class="lead">${esc(r.titulo)} · ${fmtData(r.data)}</div><ul>${s.i.map(i=>`<li class="${i.n===2?'n2':''}">${esc(i.x)}</li>`).join('')}</ul>`));
  for(let i=0;i<r.encaminhamentos.length;i+=6){
    slList.push(`<h2>Encaminhamentos</h2><div class="lead">${r.encaminhamentos.length} no total · ${r.encaminhamentos.filter(e=>e.status==='Concluído').length} concluído(s)</div>${r.encaminhamentos.slice(i,i+6).map(e=>`<div class="row"><div class="tx">${esc(e.texto)}<br><small>📌 ${esc(e.item||'sem item da pauta')} · 👤 ${esc(e.responsavel||'—')}${e.prazo?' · 📅 '+fmtData(e.prazo):''}</small></div><span class="pill ${stCls(e.status)}">${esc(e.status)}</span></div>`).join('')}`);
  }
  return true;
}
function renderSlide(){$('slBody').innerHTML=slList[slIdx];$('slInfo').textContent=`Reuniões GETECO · ${slIdx+1} / ${slList.length}`;$('slDots').innerHTML=slList.map((_,i)=>`<i class="${i===slIdx?'on':''}"></i>`).join('');}
function abrirSlides(){if(!montarSlides()){toast('Selecione uma reunião.');return;}slIdx=0;renderSlide();$('slides').classList.add('show');}
function fecharSlides(){$('slides').classList.remove('show');if(document.fullscreenElement)document.exitFullscreen();}
function slideIr(d){slIdx=Math.max(0,Math.min(slList.length-1,slIdx+d));renderSlide();}
function fullscreenSlides(){const e=$('slides');if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen();}
document.addEventListener('keydown',e=>{
  if($('slides').classList.contains('show')){
    if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();slideIr(1);}
    if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();slideIr(-1);}
    if(e.key==='Escape')fecharSlides();
  }else if(e.key==='Escape'){fecharOv('ovReu');fecharOv('ovEnc');}
});

/* tema acompanha o sistema principal */
function aplicarTema(){let t='light';try{t=localStorage.getItem('theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}
window.addEventListener('storage',e=>{if(e.key==='theme')aplicarTema();});aplicarTema();

(async function(){await carregar();renderTudo();})();
</script>
